# ─────────────────────────────────────────────────────────────────────────────
# Redis 7 configuration — BookingAutomation local development
#
# Optimised for BullMQ job queues:
#   • RDB + AOF persistence  — survive container restarts without losing jobs
#   • noeviction policy      — Redis returns an error instead of silently
#                              dropping job data under memory pressure
#   • 512 MB memory cap      — reasonable limit for a dev workstation
# ─────────────────────────────────────────────────────────────────────────────

# ── Network ───────────────────────────────────────────────────────────────────
# Accept connections from anywhere inside the Docker network
bind 0.0.0.0
protected-mode no

# ── Logging ───────────────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ── Persistence: RDB snapshots ────────────────────────────────────────────────
# Save a snapshot when at least N keys changed in M seconds:
#   1 key changed in the last hour
#   100 keys changed in the last 5 minutes
#   10 000 keys changed in the last 60 seconds
save 3600 1
save 300  100
save 60   10000

# ── Persistence: Append-Only File (AOF) ──────────────────────────────────────
# AOF ensures BullMQ job state survives a crash without waiting for the next
# RDB snapshot.  fsync every second balances durability against throughput.
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# ── Memory ────────────────────────────────────────────────────────────────────
# noeviction: Redis returns ENOMEM rather than silently evicting job data.
# BullMQ relies on this guarantee — never use allkeys-lru with BullMQ.
maxmemory 512mb
maxmemory-policy noeviction

# ── Slow log — helpful for diagnosing queue performance ──────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Client timeouts ───────────────────────────────────────────────────────────
# Do not close idle connections — BullMQ workers hold long-lived connections
timeout 0
tcp-keepalive 300
